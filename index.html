    <!-- Enable scroll-reveal animations only when JS is running. If the bundle
         never hydrates (slow/blocked JS), a failsafe unhides all content so the
         pre-rendered page is always visible on throttled networks. -->
    <script>
      document.documentElement.classList.add("js-reveal");
      window.__revealFailsafe = setTimeout(function () {
        document.documentElement.classList.remove("js-reveal");
